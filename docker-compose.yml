services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-curriculum-dashboard:latest
    container_name: agentic-curriculum-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-8501}:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8501
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
